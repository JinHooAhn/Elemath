<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>짝을 찾아라! 합이 목표 숫자</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<style>
:root{
  --bg:#fff6dd; --card:#ffffff; --ink:#2b2a4c; --muted:#6b6a8a; --line:#e6dcc0;
  --accent:#5b5bd6; --ok:#2e9e5b; --no:#e5484d; --sel:#fff0c2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#1d1b33; --card:#2a2850; --ink:#fff4d6; --muted:#b5b2d8; --line:#46437a;
    --accent:#9d9dff; --ok:#58d68d; --no:#ff7a7f; --sel:#45418a;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  min-height:100vh; display:flex; justify-content:center; padding:16px;
}
.wrap{width:100%; max-width:480px}
.back{display:inline-block; color:var(--muted); text-decoration:none; font-size:1rem; padding:6px 2px}
.back:hover{color:var(--ink)}
h1{font-size:1.6rem; margin:2px 0 10px; text-align:center}
.bar{display:flex; justify-content:space-between; gap:8px; font-size:1.05rem; margin-bottom:12px}
.bar span{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:6px 14px}
.mute{font:inherit; font-size:1.2rem; background:var(--card); border:2px solid var(--line); border-radius:999px; padding:4px 12px; cursor:pointer; color:var(--ink)}
.mute:focus-visible{outline:4px solid var(--accent); outline-offset:2px}
.confetti{position:fixed; top:-40px; font-size:1.7rem; pointer-events:none; z-index:50; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.target{
  text-align:center; background:var(--card); border:3px solid var(--line);
  border-radius:22px; padding:10px 12px; margin-bottom:12px;
}
.target small{display:block; color:var(--muted); font-size:1rem}
.target b{font-size:3rem; color:var(--accent); line-height:1.1}
.board{
  position:relative; width:100%; max-width:360px; margin:0 auto; aspect-ratio:1;
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  background:var(--card); border:3px solid var(--line); border-radius:24px; padding:6px;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.cell{padding:5px}
.chip{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:2.6rem; border-radius:18px; border:3px solid var(--line);
  background:var(--bg); cursor:pointer; transition:transform .1s, background .1s;
}
.cell.sel .chip{background:var(--sel); border-color:var(--accent); transform:scale(1.07)}
.cell.bad .chip{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.cell.bad .chip{animation:none; border-color:var(--no)}}
#lines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2}
.msg{min-height:3.4em; text-align:center; font-size:1.15rem; margin:14px 0 6px}
.help{text-align:center; color:var(--muted); font-size:.95rem; margin:0 0 12px}
.btn{
  display:block; margin:0 auto; font:inherit; font-size:1.1rem; padding:10px 26px;
  border-radius:999px; border:3px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
}
.btn:hover{background:var(--sel)}
.btn:focus-visible{outline:4px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 게임 목록</a>
  <h1>🧩 짝을 찾아라!</h1>
  <div class="bar"><span id="found">찾은 짝 0 / 3</span><span id="solved">푼 문제 0개</span><button class="mute" id="mute" type="button" aria-label="소리 끄기">🔊</button></div>
  <div class="target"><small>목표 숫자</small><b id="target">7</b></div>
  <div class="board" id="board">
    <svg id="lines" viewBox="0 0 300 300" aria-hidden="true"></svg>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <p class="help">위, 아래, 옆으로 붙어 있는 두 칸을 손가락으로 쓱 끌어 보세요.<br>두 칸을 차례로 눌러도 돼요.</p>
  <button class="btn" id="again" type="button">새 문제</button>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var board=$("board"), lines=$("lines");
  var NS="http://www.w3.org/2000/svg";
  var TARGETS=[7,8,9], COLORS=["#e5484d","#3b82f6","#2fa84f"];
  var NEED=3, turn=0;
  var target=0, found={}, foundCount=0, solved=0, locked=false, timer=null;
  var cells=[];
  var down=null, second=null, anchor=null, tapOff=false;

  // ----- 빵빠레 소리와 색종이 -----
  var actx=null, muted=false;
  function audio(){
    if(!actx){
      var C=window.AudioContext||window.webkitAudioContext;
      if(C){try{actx=new C()}catch(err){actx=null}}
    }
    if(actx&&actx.state==="suspended"){actx.resume()}
    return actx;
  }
  function tone(freq,start,dur,type,vol){
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,start);
    g.gain.linearRampToValueAtTime(vol,start+0.02);
    g.gain.setValueAtTime(vol,start+Math.max(dur-0.08,0.03));
    g.gain.linearRampToValueAtTime(0.0001,start+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(start); o.stop(start+dur+0.03);
  }
  function fanfare(){
    if(muted)return;
    var a=audio();
    if(!a)return;
    var t=a.currentTime+0.05;
    // 빠 빠 빠 빠~안 / 빠밤 빠~~아암!
    var notes=[[523,0,.13],[523,.16,.13],[523,.32,.13],[659,.48,.42],
               [587,.95,.13],[659,1.12,.13],[784,1.3,.9]];
    notes.forEach(function(n){
      tone(n[0],t+n[1],n[2],"square",0.07);
      tone(n[0]/2,t+n[1],n[2],"triangle",0.1);
    });
    // 마지막 소리는 화음으로 크게
    tone(988,t+1.3,.9,"square",0.05);
    tone(523,t+1.3,.9,"sawtooth",0.04);
  }
  function confetti(){
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    var icons=["🎉","⭐","✨","🎊","🌟"];
    for(var i=0;i<36;i++){
      var d=document.createElement("div");
      d.className="confetti";
      d.textContent=icons[rnd(0,icons.length-1)];
      d.style.left=rnd(0,96)+"vw";
      d.style.animationDuration=(2+Math.random()*1.8).toFixed(2)+"s";
      d.style.animationDelay=(Math.random()*.5).toFixed(2)+"s";
      document.body.appendChild(d);
      (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},4200)})(d);
    }
  }

  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}

  function edgeList(){
    var e=[];
    for(var i=0;i<9;i++){
      var r=Math.floor(i/3), c=i%3;
      if(c<2)e.push([i,i+1]);
      if(r<2)e.push([i,i+3]);
    }
    return e;
  }
  var EDGES=edgeList();

  function answerPairs(v,t){
    return EDGES.filter(function(e){return v[e[0]]+v[e[1]]===t});
  }

  // 정답 짝의 숫자 조합이 서로 달라야 해요. (예: 7 → 1+6, 2+5, 3+4)
  function distinctCombos(v,pairs){
    var seen={};
    for(var k=0;k<pairs.length;k++){
      var x=v[pairs[k][0]], y=v[pairs[k][1]];
      var key=Math.min(x,y)+"+"+Math.max(x,y);
      if(seen[key])return false;
      seen[key]=true;
    }
    return true;
  }

  // 정답 짝끼리 같은 칸을 쓰지 않는지 확인해요.
  function noOverlap(pairs){
    var used={};
    for(var k=0;k<pairs.length;k++){
      if(used[pairs[k][0]]||used[pairs[k][1]])return false;
      used[pairs[k][0]]=true; used[pairs[k][1]]=true;
    }
    return true;
  }

  // 정답 짝이 정확히 3개이고, 칸도 숫자 조합도 겹치지 않을 때까지 다시 뽑아요.
  function generate(){
    var t=TARGETS[turn%TARGETS.length]; // 7 → 8 → 9 → 7 … 순서로 돌아가요
    turn++;
    for(var k=0;k<50000;k++){
      var v=[];
      for(var i=0;i<9;i++)v.push(rnd(1,9));
      var ps=answerPairs(v,t);
      if(ps.length===NEED&&noOverlap(ps)&&distinctCombos(v,ps))return {v:v,t:t};
    }
    return {v:[2,5,3,4,3,1,4,5,6],t:7};
  }

  function adj(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
  function keyOf(a,b){return a.i<b.i?a.i+"-"+b.i:b.i+"-"+a.i}

  function ui(){
    $("target").textContent=target;
    $("found").textContent="찾은 짝 "+foundCount+" / "+NEED;
    $("solved").textContent="푼 문제 "+solved+"개";
  }

  function newPuzzle(){
    clearTimeout(timer);
    var g=generate();
    target=g.t; found={}; foundCount=0; locked=false;
    down=null; second=null; anchor=null;
    lines.innerHTML="";
    Array.prototype.slice.call(board.querySelectorAll(".cell")).forEach(function(n){board.removeChild(n)});
    cells=[];
    for(var i=0;i<9;i++){
      var el=document.createElement("div");
      el.className="cell";
      var chip=document.createElement("div");
      chip.className="chip";
      chip.textContent=g.v[i];
      el.appendChild(chip);
      board.appendChild(el);
      cells.push({i:i,r:Math.floor(i/3),c:i%3,v:g.v[i],el:el});
    }
    $("msg").textContent="합이 목표 숫자가 되는 이웃한 두 칸을 모두 찾아요!";
    ui();
  }

  function clearSel(){cells.forEach(function(c){c.el.classList.remove("sel")})}
  function mark(c){c.el.classList.add("sel")}
  function unmark(c){c.el.classList.remove("sel")}

  function cellAt(e){
    var el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el||!el.closest)return null;
    var c=el.closest(".cell");
    if(!c||!board.contains(c))return null;
    return cells.filter(function(x){return x.el===c})[0]||null;
  }

  function drawLine(a,b,color){
    var l=document.createElementNS(NS,"line");
    l.setAttribute("x1",a.c*100+50); l.setAttribute("y1",a.r*100+50);
    l.setAttribute("x2",b.c*100+50); l.setAttribute("y2",b.r*100+50);
    l.setAttribute("stroke",color);
    l.setAttribute("stroke-width","64");
    l.setAttribute("stroke-linecap","round");
    l.setAttribute("opacity",".4");
    lines.appendChild(l);
  }

  function finish(a,b){
    var sum=a.v+b.v, key=keyOf(a,b), msg=$("msg");
    if(found[key]){
      msg.textContent="이미 찾은 짝이에요. 다른 짝을 찾아 봐요!";
      return;
    }
    if(sum===target){
      found[key]=true;
      drawLine(a,b,COLORS[foundCount%COLORS.length]);
      foundCount++;
      ui();
      if(foundCount>=NEED){
        locked=true;
        solved++;
        ui();
        msg.textContent="🌟 "+a.v+" + "+b.v+" = "+sum+"  짝을 모두 찾았어요! 잠시 뒤 다음 문제예요.";
        fanfare();
        confetti();
        timer=setTimeout(newPuzzle,3500);
      }else{
        msg.textContent="🎉 "+a.v+" + "+b.v+" = "+sum+"  맞아요! 아직 "+(NEED-foundCount)+"개 남았어요.";
      }
    }else{
      msg.textContent="😅 "+a.v+" + "+b.v+" = "+sum+"  목표 숫자와 달라요. 다시 해 봐요!";
      [a,b].forEach(function(c){
        c.el.classList.add("bad");
        setTimeout(function(){c.el.classList.remove("bad")},400);
      });
    }
  }

  board.addEventListener("pointerdown",function(e){
    audio(); // 소리는 화면을 처음 누른 뒤부터 낼 수 있어요
    if(locked)return;
    var cell=cellAt(e);
    if(!cell)return;
    e.preventDefault();
    if(anchor&&anchor!==cell&&adj(anchor,cell)){
      var a=anchor;
      anchor=null; clearSel();
      finish(a,cell);
      return;
    }
    tapOff=(anchor===cell);
    clearSel(); anchor=null;
    down=cell; second=null;
    mark(cell);
  });

  window.addEventListener("pointermove",function(e){
    if(!down)return;
    var cell=cellAt(e);
    if(!cell)return;
    if(second){
      if(cell===down){unmark(second);second=null}
      else if(cell!==second&&adj(down,cell)){unmark(second);second=cell;mark(cell)}
    }else if(cell!==down&&adj(down,cell)){
      second=cell; mark(cell);
    }
  });

  function release(){
    if(!down)return;
    var a=down, b=second;
    down=null; second=null;
    if(b){
      clearSel();
      finish(a,b);
    }else if(tapOff){
      anchor=null; clearSel();
    }else{
      anchor=a; mark(a);
    }
  }
  window.addEventListener("pointerup",release);
  window.addEventListener("pointercancel",release);

  $("again").addEventListener("click",newPuzzle);
  $("mute").addEventListener("click",function(){
    muted=!muted;
    this.textContent=muted?"🔇":"🔊";
    this.setAttribute("aria-label",muted?"소리 켜기":"소리 끄기");
    if(!muted)audio();
  });
  newPuzzle();
})();
</script>
</body>
</html>
